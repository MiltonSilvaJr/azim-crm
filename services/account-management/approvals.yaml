# ============================================================
# VAL-ACC-01 — Política de retenção e descarte de dados (RNF 4)
# ============================================================
- id: VAL-ACC-01
  title: "Política de retenção e descarte de registros de contato"
  category: legal_compliance
  priority: blocker_for_go_live
  status: pending
  description: >
    O design do MVP adota anonimização in-place (DD-001): campos de PII da tabela
    contacts são substituídos por marcadores mas a linha não é excluída fisicamente.
    A LGPD (Art. 18) permite diferentes formas de atendimento ao direito ao
    esquecimento. É necessário validação jurídica de que a anonimização in-place
    é suficiente para o caso de uso do Azim CRM, ou se uma política de expurgo
    físico com TTL deve ser implementada.
  required_approver: jurídico
  required_action: >
    Equipe jurídica deve confirmar formalmente:
    (a) a anonimização in-place é suficiente para LGPD Art. 18 no contexto do CRM, OU
    (b) indicar o período de retenção e requisitos de expurgo físico que precisam
        ser implementados antes do go-live.
  technical_reference: design.md §17 DD-001, requirements.md RNF 4
  risk_if_not_resolved: Não conformidade com LGPD Art. 18 (direito ao esquecimento)
  status_decision: "Anonimização in-place (MVP) — mantém DD-001"
  approved_by: "Milton Antonio (Product Owner) — diretriz; ratificação jurídica formal pendente"
  approved_at: "2026-06-15"
  notes: >
    DECISÃO (2026-06-15): mantém anonimização in-place (DD-001) — já implementado,
    sem retrabalho. LGPD Art. 18 admite anonimização como forma válida. Pendente:
    ratificação formal do jurídico antes do go-live.

# ============================================================
# VAL-ACC-02 — Base legal para tratamento de PII de contatos (RNF 3)
# ============================================================
- id: VAL-ACC-02
  title: "Base legal LGPD para tratamento de PII de contatos"
  category: legal_compliance
  priority: blocker_for_go_live
  status: pending
  description: >
    O módulo armazena dados pessoais de contatos (nome, e-mail, telefone) vinculados
    a contas comerciais. A LGPD (Lei 13.709/2018) exige base legal explícita para
    cada finalidade de tratamento. As bases candidatas para o Azim CRM são:
    legítimo interesse do controlador (Art. 7, IX) ou execução de contrato (Art. 7, V).
    É necessária validação jurídica da base legal aplicável e registro no ROPA
    (Record of Processing Activities).
  required_approver: jurídico
  required_action: >
    Equipe jurídica deve:
    (a) confirmar a base legal LGPD aplicável para armazenamento de PII de contatos, e
    (b) registrar no ROPA (se aplicável) antes do go-live.
  technical_reference: requirements.md RNF 3, design.md §10
  risk_if_not_resolved: Tratamento de PII sem base legal — não conformidade LGPD
  status_decision: "Legítimo interesse (Art. 7, IX) como base primária"
  approved_by: "Milton Antonio (Product Owner) — diretriz; ratificação jurídica formal pendente"
  approved_at: "2026-06-15"
  notes: >
    DECISÃO (2026-06-15): base legal primária = legítimo interesse (Art. 7, IX),
    cobre prospects e clientes. Pendente: jurídico documentar o LIA (teste de
    legítimo interesse) e registrar no ROPA antes do go-live.

# ============================================================
# VAL-ACC-03 — Conta compartilhada por tenant, não por BU (Req 2)
# ============================================================
- id: VAL-ACC-03
  title: "Confirmação de regra de negócio: conta por tenant, não por BU"
  category: product_decision
  priority: blocker_for_go_live
  status: decided
  decision: "Segmentar contas por BU (Business Unit) — diverge do design/código atual (sem bu_id)"
  description: >
    O design atual implementa contas (empresas clientes) como entidades do tenant
    completo, visíveis e acessíveis por qualquer usuário do tenant,
    independentemente da BU (Business Unit) à qual pertence (Req 2.3 — sem bu_id
    na tabela accounts). Esta é uma decisão de produto com impacto significativo
    em controle de acesso e isolamento de dados entre equipes de vendas.
  required_approver: product_owner
  required_action: >
    Product Owner deve confirmar formalmente que a regra "conta compartilhada por
    todo o tenant" é a regra de negócio correta para o MVP — ou indicar se algum
    controle de visibilidade por BU deve ser adicionado antes do go-live.
  technical_reference: requirements.md Req 2, design.md §4.1, tasks.md TASK-08
  risk_if_not_resolved: >
    Conta de cliente de uma BU visível para vendedores de outra BU —
    possível conflito comercial ou exigência de segmentação por equipe.
  approved_by: "Milton Antonio (Product Owner)"
  approved_at: "2026-06-15"
  notes: >
    DECISÃO (2026-06-15): contas serão SEGMENTADAS POR BU (não compartilhadas por
    tenant). ⚠️ DIVERGE do design/código atual (Req 2.3, sem bu_id em accounts).
    Ação de implementação pendente (escopo novo): adicionar bu_id em accounts +
    migration; estender RLS/EF Global Query Filter para filtrar por BU além de
    tenant_id; ajustar RBAC e endpoints; revisar requirements.md Req 2 e design §4.1;
    novos testes de isolamento por BU. Recomendação técnica era manter por tenant no MVP.

# ============================================================
# Confirmação de residência de dados (RNF 10)
# ============================================================
data_residency:
  region: southamerica-east1
  cloud_provider: GCP
  cloud_sql_instance_note: >
    A string de conexão de produção deve apontar para instância Cloud SQL em
    southamerica-east1. Nenhuma réplica de leitura cross-region deve ser criada
    sem ADR formal aprovado (RNF 10.2).
  connection_string_template: >
    Host=<cloud-sql-proxy-host>;Port=5432;Database=azim_account_management;
    Username=app;Password=<secret-manager-ref>;SSL Mode=Require;
    ApplicationName=account-management
  confirmed_by: null
  confirmed_at: null
  note: >
    Em desenvolvimento/CI usa-se Testcontainers com PostgreSQL local.
    Em produção, a connection string é injetada via Secret Manager e deve
    referenciar instância em southamerica-east1.

