# approvals.yaml — partner-management
# Registra aprovações humanas (VAL-PARTNER-*) exigidas pelo processo de DoD.
# Não editar o bloco `status` por automação; apenas o operador humano atualiza.
# Mapeia: design §19, TASK-27, TASK-29, DD-008, RISK-PM-02.

approvals:
  - id: VAL-PARTNER-01
    title: "Classificação de PII: partner.name como dado sensível"
    description: |
      Confirmar que partner.name (nome do parceiro pessoa física ou razão social) deve
      ser tratado como PII/dado sensível, sujeito a mascaramento em logs, auditoria e
      payloads de evento (Outbox). Impacta DD-008, PartnerPiiMasker e gate CI PiiScan.
    status: decided
    decision: "NÃO é PII — remover mascaramento de partner.name"
    requested_by: system
    requested_at: "2026-06-14"
    approved_by: "Milton Antonio (Product Owner)"
    approved_at: "2026-06-15"
    notes: |
      DECISÃO (2026-06-15): partner.name NÃO será tratado como PII.
      Ação de implementação pendente: remover mascaramento de name em
      PartnerPiiMasker.MaskedName, atualizar design §4 e DD-008, e ajustar o
      gate CI PiiScan para não exigir máscara em name.
      ⚠️ Recomendação técnica era manter como PII (fail-safe p/ parceiro PF);
      registrar ratificação jurídica de que o campo não conterá pessoa física.
    references:
      - docs/product/modules/partner-management/design.md#§11
      - docs/product/modules/partner-management/tasks.md#TASK-27
      - src/PartnerManagement.Infrastructure/Audit/PartnerPiiMasker.cs
