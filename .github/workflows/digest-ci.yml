# digest-ci.yml — CI mínimo do módulo digest (TASK-02)
# Executa build + test em todo PR que toca services/digest/.
# Inclui Digest.Architecture.Tests como gate obrigatório (RNF 1.3, TASK-02).
name: digest-ci

on:
  pull_request:
    paths:
      - 'services/digest/**'
      - '.github/workflows/digest-ci.yml'
  push:
    branches:
      - develop
      - 'feat/digest/**'
      - 'test/digest/**'
    paths:
      - 'services/digest/**'
  workflow_dispatch: {}

env:
  DOTNET_VERSION: '10.0.107'
  SOLUTION: 'services/digest/Digest.slnx'

jobs:
  # ---------------------------------------------------------------------------
  # build-and-test — compila + roda todos os testes (incluindo arquitetura)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: build + test (digest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (0 warnings — TreatWarningsAsErrors)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Test (inclui Architecture.Tests como gate obrigatório)
        run: >
          dotnet test ${{ env.SOLUTION }}
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-digest
          path: '**/test-results.trx'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-digest
          path: '**/coverage.cobertura.xml'

  # ---------------------------------------------------------------------------
  # isolation-gate — gate obrigatório de RLS cross-tenant (TASK-25, RNF 1.3)
  # Bloqueia merge se qualquer cenário de isolamento falhar (ADR-0001, RISK-DIGEST-04).
  # ---------------------------------------------------------------------------
  isolation-gate:
    name: RLS cross-tenant isolation gate (SecurityGate — TASK-25)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Gate isolamento cross-tenant (sev-1 — ADR-0001, RNF 1.3, TASK-25)
        run: >
          dotnet test services/digest/tests/Digest.Infrastructure.Tests/Digest.Infrastructure.Tests.csproj
          --no-build --configuration Release
          --filter "Category=SecurityGate"
          --logger "console;verbosity=normal"
        # Testa: tenant A vs B (email_digest_logs), tokens cross-tenant,
        # RLS WITH CHECK e falha-fechada sem SET app.current_tenant.
        # Testcontainers cria PostgreSQL real com FORCE ROW LEVEL SECURITY.
        # Violação = breaking change de segurança sev-1.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
