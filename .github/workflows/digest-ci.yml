# digest-ci.yml — CI mínimo do módulo digest (TASK-02)
# Executa build + test em todo PR que toca services/digest/.
# Inclui Digest.Architecture.Tests como gate obrigatório (RNF 1.3, TASK-02).
name: digest-ci

on:
  pull_request:
    paths:
      - 'services/digest/**'
      - '.github/workflows/digest-ci.yml'
  push:
    branches:
      - develop
      - 'feat/digest/**'
      - 'test/digest/**'
    paths:
      - 'services/digest/**'
  workflow_dispatch: {}

env:
  DOTNET_VERSION: '10.0.107'
  SOLUTION: 'services/digest/Digest.slnx'

jobs:
  # ---------------------------------------------------------------------------
  # build-and-test — compila + roda todos os testes (incluindo arquitetura)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: build + test (digest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (0 warnings — TreatWarningsAsErrors)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Test (inclui Architecture.Tests como gate obrigatório)
        run: >
          dotnet test ${{ env.SOLUTION }}
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-digest
          path: '**/test-results.trx'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-digest
          path: '**/coverage.cobertura.xml'
