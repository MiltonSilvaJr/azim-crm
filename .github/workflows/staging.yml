# Generated by /forge:init (§20.2 — economic CI/CD).
# The expensive pipeline runs ONCE, on promotion develop -> staging. Work branches and
# develop rely on local gates (hooks + /forge:verify) — zero Actions minutes.
name: staging-pipeline
on:
  push:
    branches: [staging]
  workflow_dispatch: {}
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, contract, scan, deploy
        run: |
          echo "Pipeline de staging — preencher conforme a stack do projeto:"
          echo "  build + suite integrada + contract tests + security scan + deploy staging"
          echo "Checks baratos rodam localmente (hooks .forge/hooks/git + /forge:verify)."

  # ---------------------------------------------------------------------------
  # Gate gitleaks — módulo authentication (RNF 7.3, TASK-13, DD-005)
  # Bloqueia o build ao detectar segredo versionado em qualquer push relevante.
  # ---------------------------------------------------------------------------
  authentication-gitleaks-gate:
    name: authentication / gitleaks (RNF 7.3 gate)
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/feat/authentication') ||
      startsWith(github.ref, 'refs/heads/test/authentication') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks scan (segredos versionados — RNF 7.3, DD-005)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # Configuração: bloqueia presença de qualquer segredo no histórico do repositório.
        # A service account key do Firebase Admin SDK é obtida via Secret Manager em runtime (DD-005).
        # Nenhum segredo deve estar em código, imagem, env em texto claro ou no repositório.

  # ---------------------------------------------------------------------------
  # Gate de Architecture Tests do módulo authentication (DD-001, TASK-02)
  # Roda em pushes de branches feat/authentication/** e em develop/staging.
  # Falha o build imediatamente se Firebase Admin SDK ou identity_uid vazarem
  # para fora de Authentication.Infrastructure (Req 6.2, 6.3, RISK-AUTH-03).
  # ---------------------------------------------------------------------------
  authentication-architecture-gate:
    name: authentication / Architecture.Tests (DD-001 gate)
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/feat/authentication') ||
      startsWith(github.ref, 'refs/heads/test/authentication') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build authentication
        working-directory: services/authentication
        run: dotnet build Authentication.slnx --configuration Release

      - name: Architecture.Tests (gate obrigatório — DD-001, Req 6.2, 6.3)
        working-directory: services/authentication
        run: |
          dotnet test tests/Authentication.Architecture.Tests/ \
            --no-build --configuration Release \
            --logger "console;verbosity=normal"

  # ---------------------------------------------------------------------------
  # Gate de isolamento cross-tenant do módulo authentication (PBT-02, TASK-25)
  # Roda em pushes de branches feat/authentication/** e em develop/staging.
  # Garante que token do tenant A nunca autentica em contexto do tenant B.
  # Referência: RNF 1.4, design.md § 13, § 14, RISK-AUTH-06.
  # ---------------------------------------------------------------------------
  authentication-cross-tenant-gate:
    name: authentication / PBT-02 cross-tenant isolation (RNF 1.4 gate)
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/feat/authentication') ||
      startsWith(github.ref, 'refs/heads/test/authentication') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build authentication
        working-directory: services/authentication
        run: dotnet build Authentication.slnx --configuration Release

      - name: PBT-02 — Isolamento cross-tenant (gate obrigatório — RNF 1.4, PBT-02)
        working-directory: services/authentication
        run: |
          dotnet test tests/Authentication.Infrastructure.Tests/ \
            --no-build --configuration Release \
            --filter "FullyQualifiedName~CrossTenantIsolation" \
            --logger "console;verbosity=normal"
        # Nota: PBT-02 de integração completo (com Testcontainers + emulador Firebase)
        # requer ambiente de staging com Docker disponível (VAL-AUTH-02, DD-008/DD-009).
        # A camada de integração com banco real está pendente de confirmação de go-live
        # (RISK-AUTH-06). O PBT property-based (100 casos FsCheck) e os testes
        # determinísticos de SessionTokenValidator + AuthContextComposer cobrem
        # a invariante de isolamento em modo in-memory.

  # ---------------------------------------------------------------------------
  # Gate de PII em logs do módulo audit-log (RNF-002.2, TASK-19)
  # Roda nos pushes de branches feature/audit-log/** e em develop/staging.
  # ---------------------------------------------------------------------------
  audit-log-pii-scan:
    name: audit-log / PII scan em logs
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/feat/audit-log') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Verificar self-test do script pii-scan (amostra limpa)
        run: |
          chmod +x services/audit-log/scripts/pii-scan.sh
          services/audit-log/scripts/pii-scan.sh --sample-pass

      - name: Verificar self-test do script pii-scan (amostra com PII deve falhar)
        # Garante que o script detecta PII quando presente (regressão do gate)
        run: |
          if services/audit-log/scripts/pii-scan.sh --sample-fail; then
            echo "ERRO: script não detectou PII na amostra suja — gate quebrado!" >&2
            exit 1
          fi
          echo "OK: amostra com PII corretamente rejeitada pelo gate."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build audit-log
        working-directory: services/audit-log
        run: dotnet build AuditLog.slnx --configuration Release -warnaserror:false

      - name: Executar testes e capturar logs
        working-directory: services/audit-log
        run: |
          # Executa apenas os projetos de teste que não precisam de Testcontainers
          # (evitar dependência de Docker em runners sem suporte)
          dotnet test tests/AuditLog.Domain.Tests/ --no-build --configuration Release \
            --logger "console;verbosity=normal" 2>&1 | tee /tmp/audit-log-domain-tests.log
          dotnet test tests/AuditLog.Application.Tests/ --no-build --configuration Release \
            --logger "console;verbosity=normal" 2>&1 | tee /tmp/audit-log-app-tests.log
          dotnet test tests/AuditLog.Architecture.Tests/ --no-build --configuration Release \
            --logger "console;verbosity=normal" 2>&1 | tee /tmp/audit-log-arch-tests.log
          dotnet test tests/AuditLog.Api.Tests/ --no-build --configuration Release \
            --logger "console;verbosity=normal" 2>&1 | tee /tmp/audit-log-api-tests.log

      - name: PII scan nos logs dos testes (gate obrigatório — RNF-002.2)
        run: |
          echo "=== Iniciando PII scan nos logs de testes do audit-log ==="
          exit_code=0
          for log_file in /tmp/audit-log-*.log; do
            echo "Escaneando: $log_file"
            if ! services/audit-log/scripts/pii-scan.sh "$log_file"; then
              echo "FALHA: PII detectada em $log_file" >&2
              exit_code=1
            fi
          done
          if [ $exit_code -ne 0 ]; then
            echo ""
            echo "=== PII SCAN FALHOU ===" >&2
            echo "Logs de testes contêm padrões de PII (e-mail ou telefone BR)." >&2
            echo "Verifique o Serilog destructuring e os logs de erro do AuditService." >&2
            echo "Referência: design.md §13, RNF-002.2" >&2
            exit 1
          fi
          echo "=== PII scan concluído — nenhum padrão de PII detectado ==="

  # ---------------------------------------------------------------------------
  # Gate de isolamento RLS cross-tenant do módulo tenant-administration (PBT-06, TASK-16)
  # Roda em pushes de branches feat/tenant-administration/** e em develop/staging.
  # Garante que tenant A nunca vê dados de tenant B (defesa em profundidade: EF Core filter + RLS).
  # Gate de nível sev-1: JAMAIS marcar como skip (design.md §14, ADR-0001, RISK-TA-03, RNF 1.1).
  # ---------------------------------------------------------------------------
  tenant-administration-rls-isolation-gate:
    name: tenant-administration / PBT-06 RLS isolation (SecurityGate — ADR-0001)
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/feat/tenant-administration') ||
      startsWith(github.ref, 'refs/heads/test/tenant-administration') ||
      github.event_name == 'workflow_dispatch'
    services:
      # Container PostgreSQL para Testcontainers em CI
      # Nota: os testes usam Testcontainers (Docker-in-Docker) para criar container próprio.
      # Este service block é opcional mas documenta a dependência de Docker no runner.
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build tenant-administration
        working-directory: services/tenant-administration
        run: dotnet build TenantAdministration.slnx --configuration Release

      - name: PBT-06 — Isolamento RLS cross-tenant (gate de segurança sev-1 — ADR-0001, RNF 1.1)
        working-directory: services/tenant-administration
        run: |
          dotnet test tests/TenantAdministration.Infrastructure.Tests/ \
            --no-build --configuration Release \
            --filter "Category=SecurityGate" \
            --logger "console;verbosity=normal"
        # Gate de segurança obrigatório (TASK-16, PBT-06, PBT-07):
        # - PBT-06 (5 cenários): EF Core global filter + RLS PostgreSQL — isolamento cross-tenant
        # - PBT-07 (50 casos FsCheck + 1 determinístico): atomicidade da saga de provisionamento
        # Testcontainers cria container PostgreSQL real para validar RLS de banco.
        # RLS não pode ser validado com banco em memória (ADR-0001).
        # Violação = breaking change de segurança de nível crítico.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Architecture.Tests (gate de dependências — Clean Architecture)
        working-directory: services/tenant-administration
        run: |
          dotnet test tests/TenantAdministration.Architecture.Tests/ \
            --no-build --configuration Release \
            --logger "console;verbosity=normal"

  # ---------------------------------------------------------------------------
  # Gate de Architecture Tests do módulo organization (design §3, TASK-02)
  # Valida regra de dependência entre camadas (Clean Architecture).
  # Roda em pushes de branches feat/organization/** e em develop/staging.
  # Falha o build imediatamente se qualquer dependência proibida for detectada.
  # Gate de nível obrigatório: JAMAIS marcar como skip (design §2, §3).
  # ---------------------------------------------------------------------------
  organization-architecture-gate:
    name: organization / Architecture.Tests (design §3 gate)
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/feat/organization') ||
      startsWith(github.ref, 'refs/heads/test/organization') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build organization
        working-directory: services/organization
        run: dotnet build Organization.slnx --configuration Release

      - name: Architecture.Tests (gate obrigatório — design §3, TASK-02)
        working-directory: services/organization
        run: |
          dotnet test tests/Organization.Architecture.Tests/ \
            --no-build --configuration Release \
            --logger "console;verbosity=normal"
        # Valida:
        #   - Domain não referencia Application, Infrastructure nem Api
        #   - Application não referencia Infrastructure nem Api
        #   - Contracts não referencia nenhum projeto interno
        #   - Domain não contém namespaces de EF Core, Redis, GCP SDK, ASP.NET Core ou MediatR
